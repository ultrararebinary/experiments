<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Small interface experiments by Yann, free to copy." />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#111110" />
    <meta property="og:title" content="experiments" />
    <meta property="og:description" content="Small interface experiments by Yann, free to copy." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://ultrararebinary.github.io/experiments/" />
    <meta property="og:image" content="https://ultrararebinary.github.io/experiments/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>experiments</title>
    <script>
      // Set the theme before the first paint, so a light-mode visitor never sees a dark flash.
      try {
        const stored = localStorage.getItem('theme')
        document.documentElement.dataset.theme =
          stored ?? (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
      } catch {
        document.documentElement.dataset.theme = 'dark'
      }
      if (document.documentElement.dataset.theme === 'light') {
        document.querySelector('meta[name="theme-color"]').content = '#fdfdfc'
      }
    </script>
    <script>
      // GitHub Pages lets browsers keep index.html for 10 minutes, but each deploy deletes the
      // previous build's files. If a kept copy asks for one of them, refresh that copy and
      // reload. The timestamp stops a reload loop if the files are missing for another reason.
      addEventListener(
        'error',
        (event) => {
          const url = event.target?.src || event.target?.href
          if (!url?.includes('/assets/')) return
          try {
            const last = Number(sessionStorage.getItem('stale-reload'))
            if (Date.now() - last < 10000) return
            sessionStorage.setItem('stale-reload', String(Date.now()))
          } catch {
            return
          }
          fetch(location.href, { cache: 'reload' }).finally(() => location.reload())
        },
        true,
      )
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
