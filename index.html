<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Small UI experiments, free to copy." />
    <meta name="color-scheme" content="dark light" />
    <title>experiments</title>
    <script>
      // Set the theme before the first paint, so a light-mode visitor never sees a dark flash.
      try {
        const stored = localStorage.getItem('theme')
        document.documentElement.dataset.theme =
          stored ?? (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
      } catch {
        document.documentElement.dataset.theme = 'dark'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
